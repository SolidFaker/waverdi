[package]
name = "waverdi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Verdi-style terminal RTL waveform viewer (VCD/FST/FSDB)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
rfd = { version = "0.17.2", optional = true }
wellen = "0.25.6"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["gui"]
# Native file dialogs. Disable with --no-default-features on headless/SSH-only
# builds: the viewer then always uses its built-in terminal file browser.
gui = ["dep:rfd"]

[profile.release]
lto = true

[dev-dependencies]
fst-writer = "0.3.1"
